name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (used as the git tag and the package version)'
        required: true

# Builds the Inno-installer distribution and publishes a draft GitHub release:
#   - MangaJaNaiConverterGui-Setup-<ver>.exe              per-user setup installer (wraps the slim core)
#   - MangaJaNaiConverterGui-full-package-<ver>.zip       the slim core (what MangaJaNaiUpdater downloads)
#   - manifest.json                                       the package's version, deps and file list
#   - component-*.7z + packs.json                         on-demand component packs: the TensorRT runtime,
#                                                         per-GPU builder resources, and the ONNX models
# MangaJaNaiUpdater only sees published releases (releases/latest skips drafts), so installed apps
# update once the draft is published.
jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'  # Must match <TargetFramework> across the projects

      # The package builder runs on the CI runner, so framework-dependent is fine.
      - name: Publish package builder
        run: dotnet publish BuildMangaJaNai/BuildMangaJaNai.csproj -c Release -o builder

      # Self-contained: it forms the install root and must run without a separately installed runtime.
      - name: Publish app
        run: dotnet publish MangaJaNaiConverterGui/MangaJaNaiConverterGui.csproj -c Release -r win-x64 --self-contained -o app-publish

      # Single-file self-contained updater (set in its csproj).
      - name: Publish updater
        run: dotnet publish MangaJaNaiUpdater/MangaJaNaiUpdater.csproj -c Release -o updater-publish

      # Assemble the core (aji, the upscaling backend, ONNX Runtime/DirectML, the VC++ runtime, plus the
      # TensorRT runtime and models), carve the TensorRT runtime, builder resources and models into
      # component packs, then write the slim core's manifest and full-package zip.
      - name: Assemble package
        run: ./builder/BuildMangaJaNai.exe ${{ github.event.inputs.version }} --app-dir app-publish --updater updater-publish/MangaJaNaiUpdater.exe --packs --out publish

      - name: Build setup installer
        shell: pwsh
        run: |
          choco install innosetup -y
          $ver = "${{ github.event.inputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$ver" `
            "/DSourceDir=$(Resolve-Path "publish/MangaJaNaiConverterGui-v$ver")" `
            "/O$(Get-Location)" `
            installer/mangajanaiconvertergui.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage manifest
        shell: pwsh
        run: Copy-Item "publish/MangaJaNaiConverterGui-v${{ github.event.inputs.version }}/manifest.json" manifest.json

      # allowUpdates + updateOnlyUnreleased: re-running the workflow refreshes the assets of a draft
      # release instead of failing on the existing tag, and never touches a published release.
      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          commit: ${{ github.sha }}
          draft: true
          prerelease: false
          allowUpdates: true
          updateOnlyUnreleased: true
          artifacts: >-
            MangaJaNaiConverterGui-Setup-${{ github.event.inputs.version }}.exe,
            publish/MangaJaNaiConverterGui-full-package-${{ github.event.inputs.version }}.zip,
            manifest.json,
            publish/packs-v${{ github.event.inputs.version }}/component-*.7z,
            publish/packs-v${{ github.event.inputs.version }}/packs.json
          token: ${{ secrets.GITHUB_TOKEN }}
