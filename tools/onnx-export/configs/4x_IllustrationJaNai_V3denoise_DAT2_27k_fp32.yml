# yaml-language-server: $schema=https://raw.githubusercontent.com/the-database/traiNNer-redux/refs/heads/master/schemas/redux-config.schema.json
# MangaJaNai 2.0 ONNX export: DAT2, fp32 (fp16 overflows). For DirectML and NVIDIA GPUs without bf16 (RTX 20 / GTX 16 and older).
name: 4x_IllustrationJaNai_V3denoise_DAT2_27k_fp32
scale: 4
num_gpu: auto

network_g:
  type: "dat_2"

path:
  pretrain_network_g: "path/to/4x_IllustrationJaNai_V3denoise_DAT2_27k_bf16.safetensors"

onnx:
  dynamo: false
  dtype: fp32
  opset: 17
  shape: 1x3xHxW
  verify: true
  optimize: false
