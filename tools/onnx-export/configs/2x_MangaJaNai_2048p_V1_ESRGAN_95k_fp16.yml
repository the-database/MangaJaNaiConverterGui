# yaml-language-server: $schema=https://raw.githubusercontent.com/the-database/traiNNer-redux/refs/heads/master/schemas/redux-config.schema.json
# MangaJaNai 2.0 ONNX export: ESRGAN (pixel-unshuffle), fp16. For TensorRT 11 and ONNX Runtime DirectML.
name: 2x_MangaJaNai_2048p_V1_ESRGAN_95k
scale: 2
num_gpu: auto

network_g:
  type: "esrgan"
  use_pixel_unshuffle: true

path:
  pretrain_network_g: "path/to/2x_MangaJaNai_2048p_V1_ESRGAN_95k.pth"

onnx:
  dynamo: false
  dtype: fp16
  opset: 17
  shape: 1x3xHxW
  verify: true
  optimize: false
